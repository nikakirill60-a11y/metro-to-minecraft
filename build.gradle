buildscript {
    repositories { jcenter(); maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.0'
group = 'ru.metro.objmodels'
archivesBaseName = 'objmodels'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2860'
    runDir = 'run'
    mappings = 'stable_39'
}

repositories { }
dependencies { }

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar { manifest { attributes 'FMLCorePluginContainsFMLMod': 'true' } }
